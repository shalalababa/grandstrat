[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grandstrat"
version = "0.3.0"
description = "A headless, deterministic hex-map grand-strategy simulator with fog of war and purchasable information"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ricky Bao"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gs = "grandstrat.cli:main"

[tool.setuptools]
packages = ["grandstrat", "grandstrat.agents"]

[tool.setuptools.package-data]
grandstrat = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
